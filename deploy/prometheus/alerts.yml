# Alerts on the Lineage gateway's metrics. Drift alerts propose retraining to a human;
# none of these rules triggers any automated action.
groups:
  - name: lineage
    rules:
      - alert: LineageVerificationFailure
        expr: increase(lineage_verification_failures_total[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "The gateway refused to serve: a signature, hash or digest did not verify"
          runbook: "docs/runbooks.md#verification-failure"

      - alert: LineageDriftDetected
        expr: increase(lineage_drift_alerts_total[30m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Drift on {{ $labels.signal }}: a retraining proposal was written"
          runbook: "docs/runbooks.md#drift"

      - alert: LineageHighErrorRate
        expr: |
          sum(rate(lineage_requests_total{status!="ok"}[5m]))
            / clamp_min(sum(rate(lineage_requests_total[5m])), 1e-9) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of triage requests fail"

      - alert: LineageInvalidAnswers
        expr: |
          rate(lineage_invalid_answers_total[15m])
            / clamp_min(sum(rate(lineage_requests_total{status="ok"}[15m])), 1e-9) > 0.10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "More than 10% of answers are not valid triage answers"

      - alert: LineageLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(lineage_request_seconds_bucket[5m]))) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency above 2 s"
