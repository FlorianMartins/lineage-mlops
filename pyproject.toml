[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lineage-mlops"
description = "A secured MLOps lifecycle for small language models: every step from dataset to serving is verified, gated and written to one hash-chained audit log."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Florian Martins" }]
keywords = ["mlops", "llmops", "supply-chain-security", "ml-bom", "sigstore", "policy-as-code", "lora"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
  "Typing :: Typed",
]
dynamic = ["version"]
# The core (data, audit, registry, policy, reports) is standard library only,
# so the governance half of the lifecycle runs anywhere without PyTorch.
dependencies = []

[project.optional-dependencies]
train = [
  "torch>=2.4",
  "transformers>=4.46",
  "peft>=0.13",
  "safetensors>=0.4",
  "huggingface_hub>=0.26",
  "mlflow>=2.17",
]
serve = [
  "prometheus-client>=0.20",
]
otel = [
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
]
cloud = [
  "boto3>=1.34",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "bandit[toml]>=1.7",
  "pip-audit>=2.7",
  "cyclonedx-bom>=4.0",
  "build>=1.2",
]

[project.urls]
Homepage = "https://github.com/FlorianMartins/lineage-mlops"
Repository = "https://github.com/FlorianMartins/lineage-mlops"
Issues = "https://github.com/FlorianMartins/lineage-mlops/issues"

[project.scripts]
lineage = "lineage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lineage = ["py.typed", "policy/*.rego", "data/*.toml"]

[tool.setuptools.dynamic]
version = { attr = "lineage.__version__" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "S", "ARG", "PTH", "RET", "D"]
ignore = [
  "D203", "D213", "D107", "D105",
  "S101",   # assert is how pytest works
  "RET504", # named result variables aid readability
  "S603",   # subprocess with a list argv is how we call opa/cosign/ollama on purpose
  "S607",   # ... and they are resolved from PATH by design
  "N818",   # domain exceptions read as outcomes (PolicyDenied), not as errors
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S310", "RUF059", "D100", "D101", "D102", "D103", "D104", "S105", "S106", "S108", "ARG001", "ARG002", "E501", "PTH"]
"src/lineage/cli.py" = ["ARG001"]  # every handler takes (args, workspace)
"examples/*" = ["D100", "D103", "S311", "S310"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["lineage"]
strict = true
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["torch.*", "transformers.*", "peft.*", "safetensors.*", "huggingface_hub.*", "mlflow.*",
          "prometheus_client.*", "opentelemetry.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
  # MLflow's own SQLAlchemy mappings; not ours to fix.
  "ignore:.*noload.*:DeprecationWarning",
]
markers = [
  "ml: needs the [train] extra (PyTorch, transformers, peft)",
  "tools: needs the opa and cosign binaries on PATH",
  "slow: trains or downloads a real model (minutes)",
]

[tool.coverage.run]
source = ["lineage"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "if __name__ == .__main__.:"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
skips = ["B404", "B603", "B607"]
