# =============================================================================
# CI — what a change must pass before it reaches `main`.
#
#   quality     ruff, mypy --strict
#   test        unit tests on the locked governance environment (no PyTorch)
#   ml          the full suite on the locked CPU ML stack, with a tiny offline model
#   policy      promotion policy (opa fmt/check/test) and alert rules (promtool)
#   compat      unit tests on the oldest and newest supported Python, unlocked
#   supply      pip-audit on both lock files + CycloneDX SBOM of the environment
#   secrets     gitleaks over the full history
#   ci          one status check to protect the branch with
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly: advisories appear without a commit of ours.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_LOCKED: "3.12"
  # Runners are pinned to ubuntu-24.04 (not ubuntu-latest, which moves to Ubuntu 26 on
  # 2026-10-19): the lock files and the reproducibility checks assume a fixed image.

jobs:
  quality:
    name: Lint & types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_LOCKED }}
          cache: pip
          cache-dependency-path: requirements/ml.txt
      # mypy checks against the real ML libraries: their stubs decide what is typed.
      - name: Install (locked, hashes required)
        run: |
          pip install --require-hashes -r requirements/ml.txt
          pip install --no-deps -e .
      - run: ruff check --output-format=github .
      - run: ruff format --check --diff .
      - run: mypy

  test:
    name: Tests (locked)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_LOCKED }}
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - name: Install (locked, hashes required)
        run: |
          pip install --require-hashes -r requirements/dev.txt
          pip install --no-deps -e .
      - name: Example data is reproducible
        run: |
          python examples/triage/generate.py
          git diff --exit-code examples/triage/data
      - name: Unit tests
        run: pytest --cov --cov-report=term-missing

  ml:
    name: Tests (locked ML stack, CPU)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_LOCKED }}
          cache: pip
          cache-dependency-path: requirements/ml.txt
      - name: Install (locked, hashes required)
        run: |
          pip install --require-hashes -r requirements/ml.txt
          pip install --no-deps -e .
      - uses: open-policy-agent/setup-opa@34a30e8a924d1b03ce2cf7abe97250bbb1f332b5 # v2.2.0
        with:
          version: latest
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Full suite, ML tests included
        run: pytest -m "ml or not ml" --cov --cov-report=term-missing

  policy:
    name: Policy & alert rules
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: open-policy-agent/setup-opa@34a30e8a924d1b03ce2cf7abe97250bbb1f332b5 # v2.2.0
        with:
          version: latest
      - run: opa fmt --list --fail src/lineage/policy
      - run: opa check --strict src/lineage/policy
      - run: opa test -v src/lineage/policy
      - name: Prometheus alert rules (promtool check + unit tests)
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/w" -w /w \
            prom/prometheus:latest check rules alerts.yml
          docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/w" -w /w \
            prom/prometheus:latest test rules alerts_test.yml

  compat:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  supply:
    name: Dependency audit & SBOM
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_LOCKED }}
      - run: pip install --require-hashes -r requirements/dev.txt
      - name: pip-audit (dev lock)
        run: python scripts/audit_deps.py requirements/dev.txt
      - name: pip-audit (ML lock, CPU PyTorch audited as its upstream version)
        run: python scripts/audit_deps.py requirements/ml.txt
      - name: SBOM (CycloneDX) of the locked ML environment
        run: cyclonedx-py requirements requirements/ml.txt --of JSON -o sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci:
    name: CI complete
    if: always()
    needs: [quality, test, ml, policy, compat, supply, secrets]
    runs-on: ubuntu-24.04
    steps:
      - name: Every required job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | python3 -c '
          import json, sys
          bad = {k: v["result"] for k, v in json.load(sys.stdin).items() if v["result"] != "success"}
          sys.exit(f"failed: {bad}" if bad else 0)'
